function drawLines(){

 const order=[...fl].sort((a,b)=>(a.id===V.focus)-(b.id===V.focus));
 order.forEach(f=>{
  const k=fl.indexOf(f),off=(k-(fl.length-1)/2)*6;
  const pts=f.path.map(p=>{const el=m.querySelector(`.cell[data-key="${p.r}|${p.s}"]`);return el?{x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2+off,w:el.offsetWidth}:null}).filter(Boolean);
  let d='';for(let i=1;i<pts.length;i++)d+=seg(pts[i-1],pts[i],gap,off);

function seg(a,b,gap,off){
 if(Math.abs(a.y-b.y)<1)return `M${a.x} ${a.y}H${b.x}`;

 const xg=a.x+dir*(a.w/2+gap/2)+off, vy=b.y>a.y?1:-1, dir2=b.x>=xg?1:-1;
 const r=Math.max(0,Math.min(12,Math.abs(b.y-a.y)/2,Math.abs(xg-a.x),Math.abs(b.x-xg)));
 return `M${a.x} ${a.y}H${xg-dir*r}Q${xg} ${a.y} ${xg} ${a.y+vy*r}V${b.y-vy*r}Q${xg} ${b.y} ${xg+dir2*r} ${b.y}H${b.x}`;
}

ackground:var(--ec)}\n.emoax{display:flex;flex-direction:column;justify-content:space-between;height:100%;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:right;padding:8px 0}\n.lh.emoh .in{flex-direction:row;align-items:stretch;justify-content:space-between}\n/* m\u00e9tricas */\n.met{padding:10px 2px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:12px;cursor:pointer}\n.met .row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11.5px}\n.met .trk{height:6px;background:var(--soft);border-radius:3px;position:relative;overflow:visible}\n.met .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}\n.met .trk em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}\n.met.over .trk i{background:var(--red)}\n.met.over .row b{color:var(--red)}\n/* overlays */\n.ov{position:fixed;inset:0;background:rgba(10,18,30,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}\n.ov.show{display:flex}\n.sheet{background:#fff;border-radius:8px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.28);animation:pop .18s ease}\n@keyframes pop{from{transform:translateY(8px);opacity:0}}\n.ov.drawer{justify-content:flex-end;padding:0}\n.ov.drawer .sheet{width:min(560px,100%);height:100%;max-height:100%;border-radius:0;animation:slide .22s ease;display:flex;flex-direction:column}\n.ov.drawer .sh-body{flex:1}\n@keyframes slide{from{transform:translateX(30px);opacity:0}}\n@media (max-width:640px){.ov{align-items:flex-end;padding:0}.sheet{border-radius:12px 12px 0 0;max-height:92vh}.ov.drawer .sheet{border-radius:0}}\n.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}\n.sh-head h2{font-size:11px;margin:0;font-weight:650;letter-spacing:.14em;text-trans /* ---------- estado ---------- */
const KEY='service-blueprint-v1';let S;const V={};
try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):sample()}catch(e){S=sample()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const B=()=>S.bps.find(b=>b.id===S.current)||S.bps[0];
const actorById=id=>S.actors.find(a=>a.id===id);
const items=(l,p)=>B().cells[l+'|'+p]||[];
const allItems=()=>Object.entries(B().cells).flatMap(([k,v])=>v.map(i=>({...i,lane:k.split('|')[0],step:k.split('|')[1]})));

/* ---------- render ---------- */
function render(){renderTop();renderKpis();renderLegend();renderBp();requestAnimationFrame(drawEmo)}
function renderTop(){
 $('#bpSel').innerHTML=S.bps.map(b=>`<option value="${b.id}" ${b.id===B().id?'selected':''}>${esc(b.name)}</option>`).join('');
 const b=B();
 $('#ctx').innerHTML=`<span><b>Sigla</b><span class="sig">${esc(b.sigla||'—')}</span></span><span><b>Persona</b>${esc(b.persona||'—')}</span><span><b>Canal</b>${esc(b.channel||'—')}</span><span><b>Objetivo</b>${esc(b.goal||'—')}</span><button class="btn ghost ed" id="editBp">${ic('edit',14)} Editar blueprint</button>`;
 $('#editBp').onclick=openBpInfo;
}
function stats(){
 const b=B(),its=allItems();
 const total=b.steps.reduce((a,s)=>a+(+s.dur||0),0);
 const over=b.steps.filter(s=>+s.sla&&+s.dur>+s.sla);
 const sys=new Set(its.map(i=>i.sys).filter(Boolean)),act=new Set(its.map(i=>i.actor).filter(Boolean));
 const emo=b.steps.length?b.steps.reduce((a,s)=>a+(+s.emo||0),0)/b.steps.length:0;
 return {total,over,fails:its.filter(i=>i.fail).length,waits:its.filter(i=>i.wait).length,mv:b.steps.filter(s=>s.mv).length,sys,act,emo,its};
}
function renderKpis(){
 const s=stats(),b=B();
 const k=[[b.steps.length,'Etapas'],[fmt(s.total),'Tempo total'],[s.over.length,'Acima do SLA',s.over.length],[s.fails,'Pontos de falha',s.fails],[s.waits,'Esperas'],[s.mv,'Momentos da verdade'],[s.sys.size+' · '+s.act.size,'Sistemas · atores'],[(s.emo>0?'+':'')+s.emo.toFixed(1).replace('.',','),'Emoção média',s.emo<0]];
 $('#kpis').innerHTML=k.map(([n,l,w])=>`<div class="kpi ${w?'warn':''}"><b>${n}</b><span>${l}</span></div>`).join('');
}
function renderLegend(){
 $('#legend').innerHTML=`<span class="lg"><span class="fl f">F</span> Ponto de falha</span><span class="lg"><span class="fl w">E</span> Espera</span><span class="lg"><span class="fl d"><i>?</i></span> Decisão</span><span class="lg"><span class="star">${ic('star',14)}</span> Momento da verdade</span><span class="lg"><span class="sig">GER</span> Ator</span><span class="lg"><span class="sig sys">SIS</span> Sistema</span><span class="lg" style="margin-left:auto">Toque numa etapa para ver a fatia completa · toque numa célula para editar</span>`;
}
function itemHTML(i,lane){
 const a=actorById(i.actor);const c=laneById(lane)?.c||'#888';
 const flags=(i.fail?'<span class="fl f" title="Ponto de falha">F</span>':'')+(i.wait?'<span class="fl w" title="Espera">E</span>':'')+(i.dec?'<span class="fl d" title="Decisão"><i>?</i></span>':'');
 const ft=(a?`<span class="sig" title="${esc(a.name)}">${esc(a.sigla)}</span>`:'')+(i.sys?`<span class="sig sys" title="Sistema">${esc(i.sys)}</span>`:'')+flags;
 return `<div class="it ${i.fail?'fail':''}" style="--c:${c}">${esc(i.t)}${ft?`<div class="ft">${ft}</div>`:''}</div>`;
}
function renderBp(){
 const b=B(),el=$('#bp');
 el.style.gridTemplateColumns=`var(--lanew) repeat(${b.steps.length},var(--colw))`;
 let h=`<svg id="emo"></svg><div class="corner">Raia ↓ · Etapa →</div>`;
 b.steps.forEach((s,i)=>h+=`<div class="sh ${s.mv?'mv':''}" data-step="${s.id}"><div class="in"><div class="th">${s.img?`<img src="${s.img}" alt="">`:ic(s.icon||'doc',20)}</div><div><div class="n">${String(i+1).padStart(2,'0')}${s.sigla?' · '+esc(s.sigla):''} ${s.mv?`<span class="star" title="Momento da verdade">${ic('star',12)}</span>`:''}</div><div class="nm">${esc(s.name)}</div></div></div></div>`);
 LANES.forEach(L=>{
  if(L.line){
   h+=`<div class="ln lab" style="--lc:${L.lc}"><span>${L.line}</span></div>`;
   b.steps.forEach(s=>{const show=items(L.a,s.id).length&&items(L.b,s.id).length;h+=`<div class="ln" style="--lc:${L.lc}">${show?`<span class="ar">${ic('updown',14)}</span>`:''}</div>`});
   return;
  }
  if(L.special==='emo'){
   h+=`<div class="lh emoh" style="--c:#8c2f39"><div class="in"><div><div class="t">${L.name}</div><div class="s">${L.sub}</div></div><div class="emoax"><span>+2</span><span>0</span><span>−2</span></div></div></div>`;
   b.steps.forEach(s=>{const e=+s.emo||0,ec=e>0?'#2f6f55':e<0?'#9b2c35':'#66758a';h+=`<div class="emo" data-emo="${s.id}" style="--ec:${ec}">${[2,1,0,-1,-2].map(v=>`<button data-v="${v}" class="${v===e?'sel':''}" title="Emoção ${v>0?'+':''}${v}"><i></i></button>`).join('')}</div>`});
   return;
  }
  if(L.special==='met'){
   h+=`<div class="lh" style="--c:#0f1c2e"><div class="in"><div class="t">${L.name}</div><div class="s">${L.sub}</div></div></div>`;
   b.steps.forEach(s=>{const d=+s.dur||0,sl=+s.sla||0,over=sl&&d>sl,mx=Math.max(d,sl,1);h+=`<div class="met ${over?'over':''}" data-step="${s.id}" title="Tempo realizado × meta"><div class="row"><b>${fmt(d)}</b><span>meta ${fmt(sl)}</span></div><div class="trk"><i style="width:${d/mx*100}%"></i>${sl?`<em style="left:calc(${sl/mx*100}% - 1px)"></em>`:''}</div>${over?`<span class="hint" style="color:var(--red);font-weight:600">+${fmt(d-sl)} acima</span>`:''}</div>`});
   return;
  }
  h+=`<div class="lh" style="--c:${L.c}"><div class="in"><div class="t">${L.name}</div><div class="s">${L.sub}</div></div></div>`;
  b.steps.forEach(s=>{const its=items(L.id,s.id);h+=its.length?`<div class="cell" data-cell="${L.id}|${s.id}">${its.map(i=>itemHTML(i,L.id)).join('')}</div>`:`<div class="cell empty" data-cell="${L.id}|${s.id}"><span class="plus">+ adicionar</span></div>`});
 });
 el.innerHTML=h;
 el.querySelectorAll('.sh,.met').forEach(x=>x.onclick=()=>openSlice(x.dataset.step));
 el.querySelectorAll('.cell').forEach(x=>x.onclick=()=>openCell(x.dataset.cell));
 el.querySelectorAll('.emo button').forEach(bt=>bt.onclick=()=>{const s=B().steps.find(z=>z.id===bt.parentNode.dataset.emo);s.emo=+bt.dataset.v;save();render()});
}
function drawEmo(){
 const el=$('#bp'),svg=$('#emo');if(!svg)return;
 svg.setAttribute('width',el.scrollWidth);svg.setAttribute('height',el.scrollHeight);
 const pts=[...el.querySelectorAll('.emo button.sel')].map(b=>{let x=b.offsetLeft+b.offsetWidth/2,y=b.offsetTop+b.offsetHeight/2;const p=b.parentNode;return{x:x+p.offsetLeft,y:y+p.offsetTop}});
 if(pts.length<2){svg.innerHTML='';return}
 let d=`M${pts[0].x} ${pts[0].y}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],c=pts[i],mx=(a.x+c.x)/2;d+=` C${mx} ${a.y} ${mx} ${c.y} ${c.x} ${c.y}`}
 const p0=el.querySelector('.emo');const mid=p0?p0.offsetTop+p0.offsetHeight/2:0;
 svg.innerHTML=`<path d="M${pts[0].x} ${mid}H${pts[pts.length-1].x}" stroke="#c3cad5" stroke-dasharray="2 4" fill="none"/><path d="${d}" fill="none" stroke="#0f1c2e" stroke-width="2" stroke-linecap="round" opacity=".75"/>`;
}
new ResizeObserver(()=>drawEmo()).observe($('#bp'));
if(document.fonts)document.fonts.ready.then(drawEmo);

/* ---------- modal ---------- */
function modal(title,body,foot,mount,drawer){
 $('#sheet').innerHTML=`<div class="sh-head"><h2>${title}</h2><button class="x" id="mx" aria-label="Fechar">${ic('x',16)}</button></div><div class="sh-body">${body}</div>${foot?`<div class="sh-foot">${foot}</div>`:''}`;
 $('#ov').classList.toggle('drawer',!!drawer);$('#ov').classList.add('show');$('#mx').onclick=close;$('#sheet').scrollTop=0;mount&&mount($('#sheet'));
}
function close(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
function confirmBox(msg,yes){modal('Confirmar',`<p class="desc">${msg}</p>`,`<div class="r"><button class="btn" id="cn">Cancelar</button><button class="btn primary" id="cy" style="background:#9b2c35;border-color:#9b2c35">Excluir</button></div>`,s=>{s.querySelector('#cn').onclick=close;s.querySelector('#cy').onclick=()=>{close();yes()}})}
function resizeImg(file,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=720,sc=Math.min(1,M/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=im.width*sc;cv.height=im.height*sc;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)}
function heroSVG(s,i){
 let g='';for(let x=0;x<=600;x+=30)g+=`<path d="M${x} 0V190"/>`;for(let y=0;y<=190;y+=30)g+=`<path d="M0 ${y}H600"/>`;
 const lanes=['#7a8699','#b08436','#1f4e8c','#4b5d73','#2a7f8f'];
 return `<svg viewBox="0 0 600 190" width="100%" height="190" preserveAspectRatio="xMinYMid slice" style="display:block"><rect width="600" height="190" fill="#0f1c2e"/><g stroke="#fff" stroke-opacity=".05">${g}</g>
 <text x="30" y="46" font-family="Inter,sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#b08436">ETAPA ${String(i+1).padStart(2,'0')}${s.sigla?' · '+esc(s.sigla):''}</text>
 <text x="30" y="76" font-family="Inter,sans-serif" font-size="22" font-weight="650" fill="#fff">${esc(s.name)}</text>
 ${lanes.map((c,k)=>`<rect x="30" y="${100+k*14}" width="${60+((k*37+i*23)%90)}" height="7" rx="2" fill="${c}" opacity=".9"/>`).join('')}
 <path d="M200 103H240M200 145H240" stroke="#fff" stroke-opacity=".25" stroke-dasharray="3 4"/>
 <circle cx="470" cy="95" r="58" fill="#fff" fill-opacity=".05" stroke="#b08436" stroke-width="1.5"/><circle cx="470" cy="95" r="74" fill="none" stroke="#fff" stroke-opacity=".1"/>
 <svg x="440" y="65" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon]||ICONS.doc}</svg></svg>`;
}

/* ---------- fatia da etapa ---------- */
function openSlice(id){
 const b=B(),i=b.steps.findIndex(s=>s.id===id),s=b.steps[i];if(!s)return;
 const over=+s.sla&&+s.dur>+s.sla;
 let body=`<div class="hero">${s.img?`<img src="${s.img}" alt="">`:heroSVG(s,i)}</div>
 <h3 class="dt">${s.mv?`<span class="star">${ic('star',18)}</span> `:''}${esc(s.name)}</h3>${s.desc?`<p class="desc">${esc(s.desc)}</p>`:''}
 <div class="kv"><div><b>Tempo</b><span style="${over?'color:var(--red)':''}">${fmt(s.dur)}</span></div><div><b>Meta (SLA)</b>${fmt(s.sla)}</div><div><b>Emoção</b>${(+s.emo>0?'+':'')+(+s.emo||0)}</div></div>`;
 LANES.forEach(L=>{
  if(L.line){body+=`<div class="sline" style="color:${L.lc}">${L.line}</div>`;return}
  if(L.special)return;
  const its=items(L.id,s.id);
  body+=`<div class="slice" style="--c:${L.c}"><h4>${L.name}</h4>${its.length?its.map(x=>itemHTML(x,L.id)).join(''):'<span class="hint">—</span>'}</div>`;
 });
 modal(`Etapa ${i+1} de ${b.steps.length}`,body,`<div style="display:flex;gap:6px"><button class="btn" id="sp" ${i===0?'disabled':''}>${ic('left')}</button><button class="btn" id="sn" ${i===b.steps.length-1?'disabled':''}>${ic('right')}</button></div><div class="r"><button class="btn primary" id="se">${ic('edit')} Editar etapa</button></div>`,sh=>{
  sh.querySelector('#sp').onclick=()=>openSlice(b.steps[i-1].id);sh.querySelector('#sn').onclick=()=>openSlice(b.steps[i+1].id);
  sh.querySelector('#se').onclick=()=>openStep(id);
 },true);
}
function openStep(id,isNew){
 const b=B(),i=b.steps.findIndex(s=>s.id===id),s=b.steps[i];let icon=s.icon||'doc',img=s.img||'';
 modal(isNew?'Nova etapa':`Editar etapa ${i+1}`,`<div class="g2"><div class="f"><label>Nome da etapa *</label><input id="s_n" value="${esc(s.name)}"></div><div class="f"><label>Sigla</label><input id="s_g" value="${esc(s.sigla)}" style="text-transform:uppercase" placeholder="Ex.: CAD"></div></div>
 <div class="f"><label>Descrição</label><textarea id="s_d">${esc(s.desc)}</textarea></div>
 <div class="g3"><div class="f"><label>Tempo realizado (min)</label><input id="s_t" type="number" min="0" value="${+s.dur||0}"></div><div class="f"><label>Meta / SLA (min)</label><input id="s_s" type="number" min="0" value="${+s.sla||0}"></div><div class="f"><label>Emoção</label><select id="s_e">${[2,1,0,-1,-2].map(v=>`<option value="${v}" ${v===(+s.emo||0)?'selected':''}>${v>0?'+':''}${v}</option>`).join('')}</select></div></div>
 <div class="f"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)"><input type="checkbox" id="s_m" ${s.mv?'checked':''} style="width:auto"> Momento da verdade (ponto decisivo para o cliente)</label></div>
 <div class="f"><label>Imagem da etapa</label><div class="imgrow"><span id="s_prev">${img?`<img src="${img}" style="width:64px;height:64px;object-fit:cover;border-radius:6px">`:''}</span><input type="file" id="s_img" accept="image/*" style="max-width:230px"><button class="btn ghost" id="s_rm" ${img?'':'hidden'}>Remover</button></div></div>
 <div class="f"><label>Ícone (quando não há imagem)</label><div style="display:flex;flex-wrap:wrap;gap:5px" id="s_ic">${STEPICONS.map(n=>`<button type="button" class="btn" data-i="${n}" style="${n===icon?'border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)':''};padding:7px">${ic(n,18)}</button>`).join('')}</div></div>
 <p class="hint">1 h = 60 min · 1 dia = 1.440 min</p>`,
 `<div style="display:flex;gap:6px"><button class="btn" id="s_l" ${i===0?'disabled':''} title="Mover para a esquerda">${ic('left')}</button><button class="btn" id="s_r" ${i===b.steps.length-1?'disabled':''} title="Mover para a direita">${ic('right')}</button><button class="btn danger" id="s_x">${ic('trash')}</button></div><div class="r"><button class="btn primary" id="s_ok">Salvar</button></div>`,sh=>{
  sh.querySelectorAll('#s_ic button').forEach(bt=>bt.onclick=()=>{icon=bt.dataset.i;sh.querySelectorAll('#s_ic button').forEach(x=>x.style.cssText='padding:7px');bt.style.cssText='padding:7px;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)'});
  sh.querySelector('#s_img').onchange=e=>{const fl=e.target.files[0];if(fl)resizeImg(fl,d=>{img=d;sh.querySelector('#s_prev').innerHTML=`<img src="${d}" style="width:64px;height:64px;object-fit:cover;border-radius:6px">`;sh.querySelector('#s_rm').hidden=false})};
  sh.querySelector('#s_rm').onclick=()=>{img='';sh.querySelector('#s_prev').innerHTML='';sh.querySelector('#s_rm').hidden=true};
  const apply=()=>{const v=q=>sh.querySelector(q).value;Object.assign(s,{name:v('#s_n').trim()||s.name,sigla:v('#s_g').trim().toUpperCase(),desc:v('#s_d').trim(),dur:+v('#s_t')||0,sla:+v('#s_s')||0,emo:+v('#s_e'),mv:sh.querySelector('#s_m').checked,icon,img})};
  const mv=d=>{apply();b.steps.splice(i,1);b.steps.splice(i+d,0,s);save();render();openStep(id)};
  sh.querySelector('#s_l').onclick=()=>mv(-1);sh.querySelector('#s_r').onclick=()=>mv(1);
  sh.querySelector('#s_ok').onclick=()=>{apply();save();render();openSlice(id)};
  sh.querySelector('#s_x').onclick=()=>confirmBox(`Excluir a etapa “${esc(s.name)}” e tudo o que há nela?`,()=>{b.steps=b.steps.filter(x=>x.id!==id);Object.keys(b.cells).forEach(k=>{if(k.endsWith('|'+id))delete b.cells[k]});save();render()});
  if(isNew)setTimeout(()=>sh.querySelector('#s_n').select(),50);
 });
}

/* ---------- edição de célula ---------- */
function openCell(key){
 const[lid,sid]=key.split('|'),L=laneById(lid),b=B(),s=b.steps.find(x=>x.id===sid);
 let its=JSON.parse(JSON.stringify(items(lid,sid)));if(!its.length)its=[{t:'',actor:'',sys:'',fail:false,wait:false,dec:false}];
 const sysList=[...new Set(Object.values(b.cells).flat().map(i=>i.sys).filter(Boolean))].sort();
 const draw=sh=>{
  sh.querySelector('#il').innerHTML=its.map((x,k)=>`<div class="ied" style="--c:${L.c}" data-k="${k}">
   <div class="f" style="margin-bottom:8px"><textarea data-f="t" placeholder="Descreva a ação, evidência ou sistema">${esc(x.t)}</textarea></div>
   <div class="tools"><select data-f="actor" title="Ator"><option value="">— ator —</option>${S.actors.map(a=>`<option value="${a.id}" ${a.id===x.actor?'selected':''}>${esc(a.sigla)} · ${esc(a.name)}</option>`).join('')}</select>
   <input type="text" data-f="sys" list="sysl" value="${esc(x.sys)}" placeholder="Sigla do sistema" style="width:130px;text-transform:uppercase">
   <label class="ck"><input type="checkbox" data-f="fail" ${x.fail?'checked':''}> Falha</label><label class="ck"><input type="checkbox" data-f="wait" ${x.wait?'checked':''}> Espera</label><label class="ck"><input type="checkbox" data-f="dec" ${x.dec?'checked':''}> Decisão</label>
   <span class="sp"></span><button type="button" data-m="-1" title="Subir">${ic('up',14)}</button><button type="button" data-m="1" title="Descer">${ic('down',14)}</button><button type="button" data-del title="Remover">${ic('trash',14)}</button></div></div>`).join('');
  sh.querySelectorAll('.ied').forEach(el=>{const k=+el.dataset.k;
   el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=inp.onchange=()=>{its[k][inp.dataset.f]=inp.type==='checkbox'?inp.checked:inp.dataset.f==='sys'?inp.value.toUpperCase():inp.value});
   el.querySelectorAll('[data-m]').forEach(bt=>bt.onclick=()=>{const j=k+ +bt.dataset.m;if(j<0||j>=its.length)return;[its[k],its[j]]=[its[j],its[k]];draw(sh)});
   el.querySelector('[data-del]').onclick=()=>{its.splice(k,1);draw(sh)};
  });
 };
 modal(`${L.name} · ${esc(s.name)}`,`<p class="hint" style="margin-top:0">${L.sub}. Marque falhas, esperas e decisões para alimentar o diagnóstico.</p><datalist id="sysl">${sysList.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div id="il"></div><button class="btn" id="iadd">${ic('plus')} Adicionar item</button>`,
 `<div class="r"><button class="btn" id="ic">Cancelar</button><button class="btn primary" id="iok">Salvar</button></div>`,sh=>{
  draw(sh);
  sh.querySelector('#iadd').onclick=()=>{its.push({t:'',actor:'',sys:'',fail:false,wait:false,dec:false});draw(sh);const t=sh.querySelectorAll('.ied textarea');t[t.length-1].focus()};
  sh.querySelector('#ic').onclick=close;
  sh.querySelector('#iok').onclick=()=>{const clean=its.filter(x=>x.t.trim()||x.sys.trim());if(clean.length)b.cells[key]=clean.map(x=>({...x,t:x.t.trim(),sys:x.sys.trim()}));else delete b.cells[key];save();render();close();toast('Salvo')};
  setTimeout(()=>{const t=sh.querySelector('.ied textarea');t&&t.focus()},50);
 });
}

/* ---------- diagnóstico ---------- */
function openDiag(){
 const b=B(),st=stats(),out=[];const nm=id=>{const i=b.steps.findIndex(s=>s.id===id);return `${String(i+1).padStart(2,'0')} · ${b.steps[i].name}`};
 st.over.forEach(s=>out.push(['Alta','#9b2c35',`Tempo acima do SLA em “${s.name}”`,`${fmt(s.dur)} realizado contra meta de ${fmt(s.sla)} (+${Math.round((s.dur/s.sla-1)*100)}%).`,s.id]));
 b.steps.forEach(s=>{const f=['cli','front','back','sup'].flatMap(l=>items(l,s.id)).filter(i=>i.fail).length;if(f&&!items('opp',s.id).length)out.push(['Alta','#9b2c35',`${f} ponto(s) de falha sem oportunidade mapeada`,`Etapa ${nm(s.id)}: registre uma ação de melhoria na raia Oportunidades.`,s.id])});
 b.steps.filter(s=>s.mv&&+s.emo<0).forEach(s=>out.push(['Alta','#9b2c35',`Momento da verdade com emoção negativa`,`Etapa ${nm(s.id)} é decisiva e hoje gera emoção ${s.emo}.`,s.id]));
 b.steps.filter(s=>!s.mv&&+s.emo<=-1).forEach(s=>out.push(['Média','#b7791f',`Emoção negativa em “${s.name}”`,`Emoção ${s.emo}. Avalie esperas e falhas desta etapa.`,s.id]));
 b.steps.forEach(s=>{const w=['cli','front','back','sup'].flatMap(l=>items(l,s.id)).filter(i=>i.wait).length;if(w>=2)out.push(['Média','#b7791f',`${w} esperas na mesma etapa`,`Etapa ${nm(s.id)}: candidata a paralelizar ou automatizar.`,s.id])});
 b.steps.forEach(s=>{if(items('cli',s.id).length&&!items('back',s.id).length&&!items('sup',s.id).length)out.push(['Média','#b7791f','Ação do cliente sem suporte interno mapeado',`Etapa ${nm(s.id)}: preencha Backstage ou Processos de suporte.`,s.id])});
 b.steps.forEach(s=>{if(items('front',s.id).some(i=>!i.actor))out.push(['Info','#1f4e8c','Frontstage sem ator definido',`Etapa ${nm(s.id)}: atribua um ator com sigla.`,s.id])});
 const cnt={};st.its.forEach(i=>{if(i.sys)cnt[i.sys]=(cnt[i.sys]||0)+1});const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
 if(top.length)out.push(['Info','#2a7f8f','Sistemas mais críticos (mais citados)',top.map(([k,v])=>`${k} (${v})`).join(' · ')+' — priorize disponibilidade e monitoração.',null]);
 const ac={};st.its.forEach(i=>{if(i.actor)ac[i.actor]=(ac[i.actor]||0)+1});const ta=Object.entries(ac).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>{const a=actorById(k);return a?`${a.sigla} (${v})`:''}).filter(Boolean);
 if(ta.length)out.push(['Info','#2a7f8f','Atores com maior carga no fluxo',ta.join(' · '),null]);
 const order={Alta:0,'Média':1,Info:2};out.sort((a,b)=>order[a[0]]-order[b[0]]);
 const n=k=>out.filter(o=>o[0]===k).length;
 modal('Diagnóstico do blueprint',`<div class="kv"><div><b>Alta</b><span style="color:#9b2c35">${n('Alta')}</span></div><div><b>Média</b><span style="color:#b7791f">${n('Média')}</span></div><div><b>Informativo</b>${n('Info')}</div></div>`+
  (out.length?out.map(([sv,c,t,d,sid])=>`<div class="ins" style="--c:${c}" ${sid?`data-s="${sid}"`:''}><span class="sv">${sv}</span><div class="tx">${esc(t)}<small>${esc(d)}</small></div></div>`).join(''):'<p class="hint">Nenhum alerta — blueprint consistente.</p>'),'',sh=>{
  sh.querySelectorAll('.ins[data-s]').forEach(x=>x.onclick=()=>openSlice(x.dataset.s));
 },true);
}

/* ---------- atores ---------- */
function openActors(){
 const draw=sh=>{sh.querySelector('#al').innerHTML=S.actors.length?S.actors.map((a,k)=>`<div class="ai" data-k="${k}"><input data-f="sigla" value="${esc(a.sigla)}" style="width:96px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace" placeholder="SIGLA"><input data-f="name" value="${esc(a.name)}" style="flex:1;min-width:120px" placeholder="Nome"><select data-f="type">${['Cliente','Interno','Parceiro','Sistema'].map(t=>`<option ${t===a.type?'selected':''}>${t}</option>`).join('')}</select><button data-del title="Remover">${ic('trash',15)}</button></div>`).join(''):'<div class="ai hint">Nenhum ator.</div>';
  sh.querySelectorAll('.ai[data-k]').forEach(el=>{const a=S.actors[+el.dataset.k];el.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=inp.onchange=()=>{a[inp.dataset.f]=inp.dataset.f==='sigla'?inp.value.toUpperCase():inp.value});el.querySelector('[data-del]').onclick=()=>{S.actors.splice(+el.dataset.k,1);S.bps.forEach(bp=>Object.values(bp.cells).flat().forEach(i=>{if(i.actor===a.id)i.actor=''}));draw(sh)}})};
 modal('Atores e siglas',`<p class="hint" style="margin-top:0">Atores são compartilhados entre todos os blueprints. A sigla aparece em cada item da matriz.</p><div class="alist" id="al"></div><button class="btn" id="aadd">${ic('plus')} Novo ator</button>`,`<div class="r"><button class="btn primary" id="aok">Concluir</button></div>`,sh=>{
  draw(sh);sh.querySelector('#aadd').onclick=()=>{S.actors.push({id:'a'+uid(),name:'',sigla:'',type:'Interno'});draw(sh);const ins=sh.querySelectorAll('.ai input[data-f="sigla"]');ins[ins.length-1].focus()};
  sh.querySelector('#aok').onclick=()=>{S.actors=S.actors.filter(a=>a.name.trim()||a.sigla.trim());save();render();close()};
 });
}
/* ---------- blueprints ---------- */
function openBpInfo(){
 const b=B();
 modal('Dados do blueprint',`<div class="g2"><div class="f"><label>Nome *</label><input id="b_n" value="${esc(b.name)}"></div><div class="f"><label>Sigla</label><input id="b_g" value="${esc(b.sigla)}" style="text-transform:uppercase"></div></div>
 <div class="g2"><div class="f"><label>Persona / tipo de cliente</label><input id="b_p" value="${esc(b.persona)}"></div><div class="f"><label>Canal principal</label><input id="b_c" value="${esc(b.channel)}"></div></div>
 <div class="f"><label>Objetivo do processo</label><input id="b_o" value="${esc(b.goal)}"></div>`,
 `${S.bps.length>1?`<button class="btn danger" id="b_x">${ic('trash')} Excluir blueprint</button>`:''}<div class="r"><button class="btn primary" id="b_ok">Salvar</button></div>`,sh=>{
  sh.querySelector('#b_ok').onclick=()=>{const v=q=>sh.querySelector(q).value.trim();Object.assign(b,{name:v('#b_n')||b.name,sigla:v('#b_g').toUpperCase(),persona:v('#b_p'),channel:v('#b_c'),goal:v('#b_o')});save();render();close()};
  const x=sh.querySelector('#b_x');if(x)x.onclick=()=>confirmBox(`Excluir o blueprint “${esc(b.name)}”?`,()=>{S.bps=S.bps.filter(z=>z.id!==b.id);S.current=S.bps[0].id;save();render()});
 });
}
$('#bpSel').onchange=e=>{S.current=e.target.value;save();render()};
$('#newBp').onclick=()=>{const names=['Descoberta','Contratação','Ativação','Uso','Suporte'];const b={id:'b'+uid(),name:'Novo blueprint',sigla:'',persona:'',goal:'',channel:'',steps:names.map((n,i)=>({id:'p'+uid(),name:n,sigla:'',icon:STEPICONS[i],dur:0,sla:0,emo:0,mv:false,desc:'',img:''})),cells:{}};S.bps.push(b);S.current=b.id;save();render();openBpInfo()};
$('#dupBp').onclick=()=>{const b=JSON.parse(JSON.stringify(B()));b.id='b'+uid();b.name+=' (cópia)';S.bps.push(b);S.current=b.id;save();render();toast('Blueprint duplicado')};
$('#addStep').onclick=()=>{const s={id:'p'+uid(),name:'Nova etapa',sigla:'',icon:'doc',dur:0,sla:0,emo:0,mv:false,desc:'',img:''};B().steps.push(s);save();render();openStep(s.id,true);setTimeout(()=>$('#scroller').scrollLeft=99999,60)};
$('#diagBtn').onclick=openDiag;$('#actorsBtn').onclick=openActors;
$('#exportBtn').onclick=()=>{const js=JSON.stringify(S,null,1);modal('Exportar',`<p class="hint" style="margin-top:0">Copie o JSON abaixo para guardar ou levar a outro navegador. Use “Importar” para restaurar.</p><div class="f"><textarea id="x_t" readonly style="min-height:260px;font-family:'IBM Plex Mono',monospace;font-size:11.5px">${esc(js)}</textarea></div>`,`<div class="r"><button class="btn primary" id="x_c">${ic('copy')} Copiar</button></div>`,sh=>{sh.querySelector('#x_c').onclick=async()=>{try{await navigator.clipboard.writeText(js);toast('Copiado!')}catch(e){sh.querySelector('#x_t').select();toast('Selecionado — use Ctrl+C')}}})};
$('#importBtn').onclick=()=>modal('Importar',`<div class="f"><label>Cole o JSON exportado</label><textarea id="i_t" style="min-height:200px;font-family:'IBM Plex Mono',monospace;font-size:11.5px"></textarea></div><div class="f"><label>…ou escolha um arquivo .json</label><input type="file" id="i_f" accept=".json,application/json"></div>`,`<div class="r"><button class="btn" id="i_c">Cancelar</button><button class="btn primary" id="i_ok">Carregar</button></div>`,sh=>{
 sh.querySelector('#i_c').onclick=close;sh.querySelector('#i_f').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>sh.querySelector('#i_t').value=t)};
 sh.querySelector('#i_ok').onclick=()=>{try{const d=JSON.parse(sh.querySelector('#i_t').value);if(!Array.isArray(d.bps)||!d.bps.length)throw 0;d.actors=d.actors||[];d.current=d.current||d.bps[0].id;S=d;save();render();close();toast('Importado')}catch(e){toast('JSON inválido')}};
});
$('#resetBtn').onclick=()=>modal('Restaurar exemplo','<p class="desc">Substitui todos os blueprints pelo exemplo inicial. Exporte antes se quiser guardar o que fez.</p>',`<div class="r"><button class="btn" id="z_c">Cancelar</button><button class="btn primary" id="z_ok">Restaurar</button></div>`,sh=>{sh.querySelector('#z_c').onclick=close;sh.querySelector('#z_ok').onclick=()=>{S=sample();save();render();close()}});
$('#addStep').innerHTML=`${ic('plus')} Etapa`;$('#diagBtn').innerHTML=`${ic('pulse')} Diagnóstico`;$('#actorsBtn').innerHTML=`${ic('users')} Atores`;
$('#newBp').innerHTML=`${ic('layers')} Novo`;$('#dupBp').innerHTML=`${ic('copy')} Duplicar`;$('#exportBtn').innerHTML=`${ic('copy')} Exportar`;$('#importBtn').innerHTML=`${ic('upload')} Importar`;$('#resetBtn').innerHTML=ic('reset');
render();

root.__render=render;

})();
/* ===== alternância ===== */
function show(k){
 if(!APPS[k])k='mapa';
 document.querySelectorAll('.app').forEach(a=>a.classList.toggle('on',a.id==='app-'+k));
 document.querySelectorAll('.switch button').forEach(b=>{b.classList.toggle('on',b.dataset.app===k);b.setAttribute('aria-selected',b.dataset.app===k)});
 try{localStorage.setItem('ferramenta-ativa',k)}catch(e){}
 try{if(location.hash!=='#'+k)history.replaceState(null,'','#'+k)}catch(e){}
 requestAnimationFrame(()=>APPS[k].__render&&APPS[k].__render());
}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>show(b.dataset.app));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(APPS[h])show(h)});
let start=location.hash.slice(1);if(!APPS[start]){try{start=localStorage.getItem('ferramenta-ativa')||'mapa'}catch(e){start='mapa'}}
show(start);
</script>
</body>
</html>
