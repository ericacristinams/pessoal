<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Gestão do Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Layout: barra lateral fixa + área de trabalho com painéis; vira navegação superior no celular */
  --bg:#f3f4f8; --surface:#ffffff; --ink:#151a2d; --muted:#5e667c; --line:#e1e4ee;
  --accent:#2f47c9; --accent-soft:#e8ebfb; --ok:#1d7f55; --ok-soft:#e3f3ea; --warn:#9a6512; --warn-soft:#fbf0dc; --bad:#b83a34; --bad-soft:#fae6e4;
  --side:#151a2d; --side-ink:#d5d9e8; --side-muted:#8a92ab;
  --display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e111b; --surface:#171b29; --ink:#e7e9f2; --muted:#9aa1b6; --line:#2a3044;
    --accent:#8e9bff; --accent-soft:#232a4d; --ok:#5fcf97; --ok-soft:#173327; --warn:#e9b65c; --warn-soft:#3a2d14; --bad:#f08079; --bad-soft:#3d1c1b;
    --side:#0a0d16; --side-ink:#d5d9e8; --side-muted:#7f87a0; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e111b; --surface:#171b29; --ink:#e7e9f2; --muted:#9aa1b6; --line:#2a3044;
  --accent:#8e9bff; --accent-soft:#232a4d; --ok:#5fcf97; --ok-soft:#173327; --warn:#e9b65c; --warn-soft:#3a2d14; --bad:#f08079; --bad-soft:#3d1c1b;
  --side:#0a0d16; --side-ink:#d5d9e8; --side-muted:#7f87a0; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-weight:800;font-size:18px;padding:0 10px;line-height:1.2}
.brand small{display:block;font:500 12px var(--body);color:var(--side-muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--side-ink);text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff}
.nav .cnt{font-size:12px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:20px;font-variant-numeric:tabular-nums}
.nav .cnt.bad{background:#b83a34;color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.save{font-size:12px;color:var(--side-muted);display:flex;gap:6px;align-items:center}
.save i{width:8px;height:8px;border-radius:50%;background:#5fcf97;display:inline-block}
.save.pend i{background:#e9b65c}.save.err i{background:#f08079}
.side-foot button{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--side-ink);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px}
.side-foot button:hover{background:rgba(255,255,255,.06)}
.main{min-width:0;padding:26px clamp(16px,3vw,36px) 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:28px;font-weight:800}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0e111b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0e111b}}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent);border-color:var(--line)}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:3px solid var(--line)}
.tile .n{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.tile.bad{border-top-color:var(--bad)}.tile.bad .n{color:var(--bad)}
.tile.warn{border-top-color:var(--warn)}.tile.ok{border-top-color:var(--ok)}.tile.acc{border-top-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 .btn{font-family:var(--body)}
.stack{display:flex;flex-direction:column;gap:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mut{background:var(--bg);color:var(--muted)}
.bar{height:7px;background:var(--bg);border-radius:6px;overflow:hidden;min-width:70px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.ok span{background:var(--ok)}.bar.warn span{background:var(--warn)}.bar.bad span{background:var(--bad)}
.muted{color:var(--muted)}.small{font-size:13px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:13px}
.date{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;min-width:52px;color:var(--muted)}
.date.late{color:var(--bad)}.date.soon{color:var(--warn)}
.empty{color:var(--muted);font-size:14px;padding:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border-left:4px solid var(--accent)}
.card:hover{box-shadow:0 2px 14px rgba(20,26,45,.08)}
.card.risco{border-left-color:var(--bad)}.card.concluido{border-left-color:var(--ok)}.card.pausado,.card.planejado{border-left-color:var(--muted)}
.card h3{font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between;padding:2px 4px 4px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:6px}
.tk .tt{font-weight:600;cursor:pointer;line-height:1.35}
.tk .tt:hover{color:var(--accent)}
.tk.done .tt{text-decoration:line-through;color:var(--muted)}
.tk .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.tk .mv{display:flex;justify-content:space-between;gap:4px}
.prio{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.prio.alta{background:var(--bad)}.prio.media{background:var(--warn)}.prio.baixa{background:var(--ok)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column}
.kv b{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.wl{display:grid;grid-template-columns:minmax(90px,140px) 1fr 34px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.wl .bar{height:10px}
#modal{position:fixed;inset:0;background:rgba(10,13,22,.5);display:grid;place-items:center;padding:16px;z-index:50}
#modal[hidden]{display:none}
.dlg{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h2{font-size:19px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.dlg .foot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin-top:8px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px}
  .brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  .nav a{white-space:nowrap;gap:6px}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .grid2{grid-template-columns:1fr}
  .top h1{font-size:23px}
}
@media (max-width:520px){ .fgrid{grid-template-columns:1fr} .side-foot .save span{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--teal:#0f8f8a;--bar:#e46a2e;--bar-done:rgba(20,26,45,.28)}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-6px 0 18px;overflow-x:auto}
.ptabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.ptabs a:hover{color:var(--ink)}
.ptabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.etable{min-width:1100px}
.etable td{padding:6px;vertical-align:middle}
.etable input,.etable select,.ctl{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 7px;font-size:13px;width:100%;min-width:0}
.etable .w-xs{width:56px}
.etable tr.sub td{background:var(--bg);padding:10px 14px}
.tiny{font-size:11.5px}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:14px}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.grade{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.grade b{display:block;font-family:var(--display);font-size:16px}
.grade span{font-size:13px;color:var(--muted)}
.grade.on{border-color:var(--accent);background:var(--accent-soft)}
.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer}
.check input{margin-top:3px}
.fgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.metric{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.metric small{display:block;color:var(--muted);font-size:12px}
.metric b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.rl{display:grid;grid-template-columns:30px minmax(150px,1.3fr) minmax(200px,2fr) 60px 80px 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rl.h{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-weight:700;font-size:12px}
.effbar{height:12px;border-radius:999px;background:linear-gradient(90deg,#7cc47f 0%,#efc85a 50%,#e3675b 100%);position:relative}
.effbar i{position:absolute;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--ink);transform:translate(-50%,-60%)}
.impact{display:grid;grid-template-columns:70px repeat(3,minmax(150px,1fr));gap:6px;min-width:560px}
.impact .ax{display:flex;align-items:center;justify-content:center;text-align:center;background:var(--bg);border-radius:8px;font-size:11px;font-weight:700;color:var(--muted);padding:6px}
.impact .cell{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:84px;font-size:12px}
.impact .cell.good{background:var(--ok-soft)}.impact .cell.mid{background:var(--warn-soft)}.impact .cell.hot{background:var(--bad-soft)}
.impact .chip{margin:2px 2px 0 0;font-size:11px;padding:1px 7px}
.gt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gt-row{display:grid;grid-template-columns:230px 1fr;min-height:46px;border-bottom:1px solid var(--line)}
.gt-row:last-child{border-bottom:0}
.gt-head{background:var(--bg);font-size:11px;font-weight:700;color:var(--muted);min-height:40px}
.gt-name{padding:7px 10px;border-right:1px solid var(--line);font-size:13px;line-height:1.3;min-width:0}
.gt-name .tiny{color:var(--muted)}
.gt-tl{position:relative;background-image:linear-gradient(to right,transparent calc(100% - 1px),var(--line) 0)}
.gt-cells{display:grid;height:100%}
.gt-cells div{border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;line-height:1.2;padding:2px}
.gt-bar{position:absolute;top:11px;height:24px;border-radius:6px;background:var(--bar);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap}
.gt-bar.dep{outline:2px solid rgba(20,26,45,.18)}
.gt-bar.done{background:var(--ok)}
.gt-bar em{position:absolute;left:0;top:0;bottom:0;background:var(--bar-done);font-style:normal}
.gt-bar span{position:relative;z-index:1}
.gl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:3;pointer-events:none}
.gl.go{background:var(--bad);width:3px}.gl.td{background:var(--teal)}
.gl b{position:absolute;top:50%;left:5px;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.gl.go b{background:var(--bad);color:#fff}.gl.td b{background:var(--teal);color:#fff;top:14%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:9px;border-radius:4px;vertical-align:middle;margin-right:5px}
.gantt-full{position:fixed;inset:8px;z-index:45;background:var(--surface);overflow:auto;padding:16px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pz{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.pz-board{background:#0a1221;border-radius:12px;padding:10px;overflow:auto;border:1px solid #26354c}
.pz-board svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
.pz-board.draw svg{cursor:crosshair}
.pz-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pz-tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.pz-list .it{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.pz-list .it:hover,.pz-list .it.on{background:var(--accent-soft);border-color:var(--line)}
.pz-list .n{font-size:11px;font-weight:700;background:var(--bg);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mini-pz{background:#0a1221;border-radius:10px;padding:6px}
.mini-pz svg{width:100%;height:auto;display:block}
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.acc+details.acc{margin-top:10px}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
details.acc .body{padding:14px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbox{background:var(--bg);border-radius:8px;padding:10px 12px}
.dbox.full{grid-column:1/-1}
.dbox h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--body)}
.dbox p{margin:0;font-size:14px}
.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pri{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--surface)}
.pri.risk{border-left-color:var(--bad)}
.pri.done{opacity:.7}.pri.done .ds{text-decoration:line-through}
.pri .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pri label{display:flex;gap:8px;align-items:flex-start;font-weight:600;margin:4px 0}
.pri label input{margin-top:3px}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quad{border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:200px}
.quad h3{font-size:16px;margin-bottom:10px}
.quad.f{background:var(--ok-soft)}.quad.w{background:var(--bad-soft)}.quad.o{background:var(--accent-soft)}.quad.t{background:var(--warn-soft)}
.quad ul{margin:0;padding-left:18px}.quad li{margin-bottom:8px;cursor:pointer}
.quad li:hover b{color:var(--accent)}
.radar text{font-size:11.5px;font-family:var(--body)}
.person{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.person:hover{border-color:var(--accent)}
.person h4{margin:8px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.person p{margin:0;font-size:13px}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-top:6px;border-top:1px solid var(--line);padding-top:10px}
.hidden{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (max-width:1100px){.pz{grid-template-columns:1fr}}
@media (max-width:900px){.grades,.checks,.fgrid3,.dgrid,.prgrid,.swot{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side,.nav,.main{min-width:0}}
.grid2>*,.grid3>*,.stack>*,.pz>*{min-width:0}
details.acc>summary{grid-template-columns:minmax(0,1fr) auto}
@media (max-width:520px){details.acc>summary{grid-template-columns:1fr}details.acc>summary .pill{white-space:normal;justify-self:start}}
/* ===== Acabamento executivo ===== */
:root{
  /* Layout: navegação lateral sóbria + área de leitura com hierarquia de relatório executivo */
  --bg:#f5f6f8; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6577; --line:#e3e6eb;
  --accent:#1f4b99; --accent-soft:#edf2fa;
  --ok:#1b7a4e; --ok-soft:#e8f4ee; --warn:#a1650b; --warn-soft:#fbf3e4; --bad:#b4342d; --bad-soft:#fbeceb;
  --side:#0f1b2d; --side-ink:#c9d1de; --side-muted:#7f8aa0;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --bar:#c0652b; --teal:#0f7f7a; --gold:#a88442;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c121c; --surface:#131b28; --ink:#e6eaf1; --muted:#97a1b3; --line:#243042;
  --accent:#8fb0ec; --accent-soft:#1a2740; --ok:#5cc690; --ok-soft:#14291f; --warn:#e2b45c; --warn-soft:#2f2614; --bad:#ee8079; --bad-soft:#341b1a;
  --side:#080d15; --side-ink:#c9d1de; --side-muted:#76819a; --bar:#d9804a; --teal:#38b5ae; --bar-done:rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#0c121c; --surface:#131b28; --ink:#e6eaf1; --muted:#97a1b3; --line:#243042;
  --accent:#8fb0ec; --accent-soft:#1a2740; --ok:#5cc690; --ok-soft:#14291f; --warn:#e2b45c; --warn-soft:#2f2614; --bad:#ee8079; --bad-soft:#341b1a;
  --side:#080d15; --side-ink:#c9d1de; --side-muted:#76819a; --bar:#d9804a; --teal:#38b5ae; --bar-done:rgba(0,0,0,.3);
}
body{font:14.5px/1.55 var(--body);letter-spacing:.005em}
h1,h2,h3{letter-spacing:0}
/* barra lateral */
.app{grid-template-columns:240px 1fr}
.side{padding:26px 16px 20px;gap:26px;border-right:1px solid rgba(255,255,255,.04)}
.brand{font-family:var(--display);font-weight:600;font-size:20px;padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);letter-spacing:.01em}
.brand small{font:500 10.5px var(--body);text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin-top:6px}
.nav{gap:1px}
.nav a{padding:8px 12px;border-radius:4px;font-size:13.5px;font-weight:500;color:var(--side-ink);position:relative}
.nav a:hover{background:rgba(255,255,255,.04);color:#fff}
.nav a.on{background:rgba(255,255,255,.07);color:#fff}
.nav a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--gold)}
.nav .cnt{font-size:11px;padding:0 7px;border-radius:3px;background:rgba(255,255,255,.08)}
.nav .cnt.bad{background:#b4342d}
.side-foot button{border-radius:4px;font-size:12.5px}
.save{font-size:11.5px}
/* cabeçalho de página */
.main{padding:30px clamp(16px,3.2vw,44px) 64px}
.top{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line);align-items:flex-end}
.top h1{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.15}
.top .sub{font-size:13.5px;margin-top:6px}
.btn{border-radius:5px;padding:7px 14px;font-weight:500;font-size:13.5px;border-color:#d4d9e1;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#1f2d44;border-color:#1f2d44}
:root[data-theme="dark"] .btn.pri{background:var(--accent);border-color:var(--accent);color:#0c121c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--accent);border-color:var(--accent);color:#0c121c}}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:4px}
.btn.ghost{border-color:transparent;background:transparent}
.banner{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;font-size:13.5px;padding:9px 14px}
/* indicadores */
.tiles{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-bottom:22px;overflow:hidden}
.tile{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;border:0;border-radius:0;border-left:1px solid var(--line);border-top:0;padding:16px 20px 18px;position:relative;background:transparent}
.tile:first-child{border-left:0}
.tile::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:2px;background:transparent}
.tile.bad::after{background:var(--bad)}.tile.warn::after{background:var(--warn)}.tile.ok::after{background:var(--ok)}.tile.acc::after{background:var(--accent)}
.tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted);line-height:1.4}
.tile .n{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;color:var(--ink)}
.tile.bad .n{color:var(--bad)}
/* painéis */
.panel{border-radius:6px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.panel h2{font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid2,.grid3,.stack{gap:18px}
.card{border-radius:6px;border-left-width:3px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.card:hover{box-shadow:0 6px 18px rgba(15,27,45,.08)}
.card h3{font-family:var(--display);font-size:17px;font-weight:600}
.card.risco{border-left-color:var(--bad)}.card.concluido{border-left-color:var(--ok)}
/* tabelas */
th{font-size:10.5px;letter-spacing:.08em;font-weight:600;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 10px}
td{padding:11px 10px}
tr.click:hover td{background:var(--accent-soft)}
/* etiquetas */
.pill{border-radius:3px;font-size:11.5px;font-weight:600;padding:2px 8px;letter-spacing:.01em}
.chip{border-radius:3px}
.bar{height:6px;border-radius:3px}
.bar span{border-radius:3px}
.av{border-radius:4px;background:var(--ink);color:#fff;font-weight:600}
:root[data-theme="dark"] .av{background:var(--accent);color:#0c121c}
/* abas */
.ptabs{margin:-8px 0 22px}
.ptabs a{font-size:13.5px;font-weight:500;padding:10px 16px}
.ptabs a.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.seg{border-radius:5px}
.seg button{font-weight:500;font-size:12.5px;padding:7px 13px}
.seg button.on{background:var(--ink);color:#fff}
:root[data-theme="dark"] .seg button.on{background:var(--accent);color:#0c121c}
.callout{border-radius:4px;font-size:13.5px;background:var(--bg);border-left-color:var(--accent);color:var(--ink)}
.metric{border-radius:5px;background:var(--surface)}
.metric small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.metric b{font-family:var(--display);font-weight:600;font-size:21px}
.kpi{border-radius:5px}
.kpi .v{font-family:var(--display);font-weight:600}
.grade{border-radius:5px}
.grade b{font-family:var(--display);font-weight:600}
.grade.on{border-color:var(--ink);background:var(--accent-soft)}
details.acc{border-radius:5px}
.quad{border-radius:6px}
.quad h3{font-family:var(--display);font-weight:600}
.dbox{border-radius:4px;border:1px solid var(--line);background:var(--bg)}
.pri{border-radius:4px}
.dlg{border-radius:8px}
.dlg h2{font-family:var(--display);font-weight:600;font-size:21px}
.fld input,.fld select,.fld textarea{border-radius:5px;background:var(--surface)}
.etable input,.etable select,.ctl{border-radius:4px;background:var(--surface)}
.col{border-radius:6px}
.col h3{font-family:var(--body);font-size:11px;letter-spacing:.09em;font-weight:600}
.tk{border-radius:5px}
.gt-scroll{border-radius:6px}
.gt-bar{border-radius:3px;font-weight:600}
.toast{border-radius:5px;font-size:13.5px}
.rank{border-radius:4px}
.pz-board{border-radius:6px}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.brand{border-bottom:0;padding-bottom:0}.nav a.on::before{display:none}.top h1{font-size:25px}.tile{border-left:0;border-top:1px solid var(--line)}.tile:first-child{border-top:0}}
.tile{flex-direction:column;justify-content:flex-start;gap:8px}
.tile .d{font-size:12px;color:var(--muted);line-height:1.35}
.pill,.metric b .pill{font-family:var(--body)}
.grid2{grid-template-columns:1.65fr 1fr}
.panel td b{font-weight:600}
.star{color:var(--gold);font-size:10px;vertical-align:middle}
.osa-bars{display:flex;flex-direction:column;gap:2px}
.ob{display:grid;grid-template-columns:24px minmax(110px,150px) 1fr 70px;gap:10px;align-items:center;padding:6px 4px;border-radius:4px;cursor:pointer;font-size:13.5px}
.ob:hover{background:var(--accent-soft)}
.obax{cursor:default;padding-top:0}.obax:hover{background:none}
.obn{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.obl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obt{position:relative;height:10px;background:var(--bg);border-radius:3px}
.obf{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.obf.ok{background:var(--ok)}.obf.warn{background:var(--warn)}.obf.bad{background:var(--bad)}.obf.mut{background:var(--line)}
.obg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.obax i{position:absolute;top:-2px;transform:translateX(-50%);font-style:normal;font-size:10.5px;color:var(--muted)}
.obv{font-weight:600;text-align:right}
@media (max-width:600px){.ob{grid-template-columns:20px 1fr 60px}.ob .obt{grid-column:2/4;grid-row:2}}

  --ok:#1b7a4e; --ok-soft:#e8f4ee; --warn:#a1650b; --warn-soft:#fbf3e4; --bad:#b4342d; --bad-soft:#fbeceb;
  --side:#0f1b2d; --side-ink:#c9d1de; --side-muted:#7f8aa0; --bar:#c0652b; --teal:#0f7f7a; --bar-done:rgba(20,26,45,.28); color-scheme:light;
}
body.skin-dark{
  --bg:#0c121c; --surface:#131b28; --ink:#e6eaf1; --muted:#97a1b3; --line:#243042; --accent:#8fb0ec; --accent-soft:#1a2740;

  --side:#080d15; --side-ink:#c9d1de; --side-muted:#76819a; --bar:#d9804a; --teal:#38b5ae; --bar-done:rgba(0,0,0,.3); color-scheme:dark;
}

body.skin-dark .seg button.on{background:var(--accent);color:#0c121c}
body.skin-dark .av{background:var(--accent);color:#0c121c}

/* Glass azul */
body.skin-glass{
  --bg:#050b1a; --surface:rgba(18,34,72,.52); --ink:#e9efff; --muted:#8e9fc6; --line:rgba(124,160,255,.16); --accent:#5b84ff; --accent-soft:rgba(91,132,255,.16);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14); --warn:#fbbf4a; --warn-soft:rgba(251,191,74,.14); --bad:#ff6b7f; --bad-soft:rgba(255,107,127,.15);

body.skin-glass .side{background:rgba(8,18,44,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-right:1px solid var(--line)}
body.skin-glass .metric,body.skin-glass .dbox,body.skin-glass .kpi,body.skin-glass .tk,body.skin-glass .pri,body.skin-glass .person,body.skin-glass .grade,body.skin-glass .check{background:rgba(255,255,255,.035);border-color:var(--line)}
body.skin-glass .tile .n,body.skin-glass .metric b,body.skin-glass h1,body.skin-glass h2,body.skin-glass h3{font-family:var(--display);letter-spacing:-.01em}
body.skin-glass .top h1{font-weight:600}
body.skin-glass th{background:rgba(255,255,255,.03)}
body.skin-glass .btn{background:rgba(255,255,255,.05);color:var(--ink)}
body.skin-glass .btn:hover{background:rgba(91,132,255,.18);border-color:rgba(124,160,255,.45)}
body.skin-glass .btn.pri{background:linear-gradient(180deg,#6e93ff,#3f6cf5);border-color:#7d9dff;color:#fff;box-shadow:0 0 0 1px rgba(125,157,255,.25),0 6px 22px rgba(63,108,245,.45)}
body.skin-glass .btn.pri:hover{background:linear-gradient(180deg,#7fa0ff,#4b77ff)}
body.skin-glass .seg{background:rgba(255,255,255,.04);border-color:var(--line)}
body.skin-glass .seg button.on{background:linear-gradient(180deg,#6e93ff,#3f6cf5);color:#fff;box-shadow:0 0 16px rgba(63,108,245,.45)}
body.skin-glass .bar{background:rgba(255,255,255,.06)}
body.skin-glass .bar span{background:linear-gradient(90deg,#3f6cf5,#7ea0ff);box-shadow:0 0 10px rgba(91,132,255,.55)}
body.skin-glass .bar.ok span{background:linear-gradient(90deg,#10b981,#5eead4);box-shadow:0 0 10px rgba(52,211,153,.45)}

/* seletor de aparência */
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.look{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 10px 12px;cursor:pointer;color:var(--ink)}
.look:hover{border-color:var(--accent)}
.look.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.look b{font-size:14px;margin-top:6px}
.look small{font-size:12px;color:var(--muted);line-height:1.35}
.look .prev{height:74px;border-radius:6px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px;border:1px solid var(--line)}
.look .prev i{display:block;height:10px;border-radius:3px;width:70%}
.look .prev.lay{flex-direction:row;gap:6px;background:var(--bg);padding:8px}
.look .prev.lay .ls{width:28%;border-radius:4px;background:var(--side)}
.look .prev.lay .ls.thin{width:10%}
.look .prev.lay .lm{flex:1;display:flex;flex-direction:column;gap:5px}
.look .prev.lay .lt{height:10px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--line)}
.look .prev.lay .lc{flex:1;border-radius:4px;background:var(--surface);border:1px solid var(--line)}

/* ===== Modelo Rail + barra superior ===== */
body.layout-rail .app.rail-app{grid-template-columns:76px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0;background:var(--side);border-right:1px solid rgba(255,255,255,.05);z-index:5}
.rlogo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#6e93ff,#3f6cf5);box-shadow:0 6px 18px rgba(63,108,245,.45)}
body.skin-default .rlogo{background:var(--gold);box-shadow:none}
.rnav{position:relative;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ri{position:relative;z-index:1;width:42px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--side-muted);background:transparent;border:0;cursor:pointer;text-decoration:none}
.ri:hover{color:#fff;background:rgba(255,255,255,.05)}
.ri.on{color:#fff}
.ri .rdot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e5484d;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.ri[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#0b1430;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid rgba(124,160,255,.2);pointer-events:none;z-index:20}
.rail-pill{position:absolute;left:0;right:0;top:0;bottom:100%;border-radius:11px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);opacity:0;pointer-events:none}
body.skin-glass .rail-pill{background:linear-gradient(180deg,rgba(110,147,255,.45),rgba(63,108,245,.35));box-shadow:0 0 18px rgba(63,108,245,.55),inset 0 0 0 1px rgba(150,180,255,.35)}
body.skin-default .rail-pill{background:rgba(168,132,66,.28);box-shadow:inset 0 0 0 1px rgba(168,132,66,.45)}
.rfoot{margin-top:auto}
body.layout-rail .main{padding-top:16px}
.tbar{position:relative;z-index:20;display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:8px 10px 8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
body.skin-glass .tbar{background:linear-gradient(180deg,rgba(28,50,104,.55),rgba(14,28,62,.5));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{opacity:.5}
.tsearch{position:relative;display:flex;align-items:center;gap:8px;flex:1;max-width:420px;margin-left:8px;padding:0 10px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
body.skin-glass .tsearch{background:rgba(5,12,30,.5)}
.tsearch input{flex:1;border:0;background:transparent;outline:none;font-size:13.5px;color:var(--ink);min-width:0}
.tsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tsearch kbd{font:500 11px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.tact{margin-left:auto;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.live.ok{color:var(--ok);border-color:rgba(52,211,153,.35)}.live.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.err i{background:var(--bad)}
.tbtn{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.tbtn:hover{border-color:var(--accent)}
.tbtn .rdot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#e5484d;color:#fff;font-size:10px;font-weight:700;line-height:17px}
.tnew{display:inline-flex;align-items:center;gap:6px;height:36px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;text-decoration:none;color:#fff;background:linear-gradient(180deg,#6e93ff,#3f6cf5)}
body.skin-default .avatar{background:var(--ink)}
.pop{position:absolute;top:calc(100% + 8px);right:0;z-index:30;min-width:320px;max-width:420px;max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
body.skin-dark .pop{background:#18212f}
.pop-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px}
.pop-it{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:7px;text-decoration:none;color:var(--ink)}
.pop-it:hover{background:var(--accent-soft)}
.pop-it .ico{flex:none;margin-top:2px;color:var(--muted)}
.pop-it span{display:flex;flex-direction:column;min-width:0}
.pop-it b{font-weight:600;font-size:13.5px}
.pop-it small{font-size:12px;color:var(--muted)}
.pop-empty{padding:12px;font-size:13px;color:var(--muted)}
body.layout-rail .top{border-bottom:0;padding-bottom:0;margin-bottom:20px}
@media (max-width:900px){
  body.layout-rail .app.rail-app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;padding:8px 12px;overflow-x:auto;justify-content:flex-start}
  .rnav{flex-direction:row;margin:0}
  .rail-pill{display:none}.ri.on{background:rgba(255,255,255,.12)}
  .rfoot{margin:0 0 0 auto}
  .ri[data-tip]:hover::after{display:none}
  .tbar{flex-wrap:wrap}.tsearch{order:3;max-width:none;flex-basis:100%;margin:0}.crumb{display:none}
}
@media (prefers-reduced-motion:reduce){.rail-pill{transition:none!important}}
body.skin-glass .pop{background:linear-gradient(180deg,#14295c,#0d1d45)}
body.skin-glass .look.on{border-color:#7d9dff;box-shadow:0 0 0 2px rgba(91,132,255,.45),0 0 24px rgba(63,108,245,.35)}
</style>

ria","seniority":"Coordenação","manager":"Gerência de Engenharia de Crédito","structure":"Quatro times: Regulatório, Modernização, Discovery A e Discovery B, com tríade PM, Tech e SME.","stakeholders":"Gerência; PMs; SMEs de crédito; Arquitetura; Plataforma","context":"Engenharia da jornada de crédito, com temas regulatórios e modernização em paralelo.","challenges":"Mostrar valor das entregas; reduzir dependência da coordenação; preparar sucessores; manter a cadência sob pressão."},"principles":[{"id":"op1","n":1,"name":"Coerência","track":"Mapeamento do time, estilo de liderança adequado a cada pessoa e escolha entre apoiar, relacionar ou direcionar.","def":"Adequar o estilo de liderança a cada pessoa e situação: apoiar, relacionar ou direcionar.","expected":"Conhece perfil e maturidade de cada liderado e escolhe o estilo de forma consciente.","deviation":"Usa o mesmo estilo com todos; direciona quem precisa de apoio e solta quem precisa de direção.","questions":"Qual a maturidade desta pessoa nesta tarefa?\nEstou apoiando, relacionando ou direcionando?\nO estilo escolhido funcionou?","indicators":"Maturidade dos liderados; evolução dos PDIs","evidenceEx":"Mapa do time atualizado; estilo registrado no 1:1","rituals":"1:1 quinzenal","priority":false,"target":3,"gap":"","impact":"","gprio":""},{"id":"op2","n":2,"name":"Antifragilidade","track":"Como a líder reage à pressão, instabilidade, conflitos e crises. Deve registrar a aplicação do framework OCEI, sem permitir postura passiva ou desestabilizada.","def":"Sair mais forte de pressão, instabilidade, conflitos e crises, aplicando o framework OCEI.","expected":"Mantém a calma, analisa, decide e transforma a crise em aprendizado.","deviation":"Postura passiva ou desestabilizada; reage no impulso.","questions":"Apliquei o OCEI nesta situação?\nO que a crise ensinou?\nO time saiu mais forte?","indicators":"Incidentes conduzidos; tempo de resposta a crises","evidenceEx":"Crise conduzida com registro do OCEI","rituals":" function buildDoc(){
  var css=document.getElementById("css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  var C="</"+"script>", ST="</"+"style>";
  return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n'+HEAD+'\n<style id="css">'+css+ST+'\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+C+'\n<script id="app">'+app+C+'\n</body>\n</html>\n';

function schedule(){ clearTimeout(saveT); if(art===null){ setSave("err","Não salvo: faça um backup"); return; } setSave("pend","Salvando…"); saveT=setTimeout(save,900); }
function save(){
  if(art===undefined || !document.getElementById("modal").hidden || PZ.drag){ saveT=setTimeout(save,700); return; }
  if(!art){ setSave("err","Não salvo: faça um backup"); return; }
  Promise.resolve().then(function(){ return art.publish(buildDoc()); }).then(function(){ setSave("ok","Tudo salvo"); }).catch(function(e){
    var c=String((e&&(e.code||e.name||e.message))||"");
    if(/conflict/i.test(c)) return;
    if(/not_granted|not_writer/i.test(c)) setSave("err","Somente leitura");
    else setSave("err","Erro ao salvar. Tente de novo");
  });
}

/* ---------- peças comuns ---------- */
function pill(txt,cls){ return '<span class="pill '+(cls||"")+'">'+esc(txt)+'</span>'; }
function bar(p,cls){ p=clamp(p,0,100); return '<div class="bar '+(cls||"")+'" role="img" aria-label="'+Math.round(p)+'%"><span style="width:'+p+'%"></span></div>'; }
function tile(n,l,c){ var lab=String(l), det=""; var i=lab.indexOf(" · "); if(i>0){ det=lab.slice(i+3); lab=lab.slice(0,i); } else { var m=lab.match(/^(.*?)\s*\((.*)\)$/); if(m){ lab=m[1]; det=m[2]; } }
  return '<div class="tile '+c+'"><div class="l">'+esc(lab)+'</div><div class="n">'+esc(n)+'</div>'+(det?'<div class="d">'+esc(det)+'</div>':'')+'</div>'; }
function metric(l,v){ return '<div class="metric"><small>'+esc(l)+'</small><b>'+v+'</b></div>'; }
function projHealth(j){ if(j.status==="concluido") return "ok"; if(j.status==="risco") return "bad"; var late=S.tasks.some(function(t){return t.projectId===j.id && isLate(t);}); var kb=(j.kpis||[]).some(function(k){return kpiCls(k)==="bad";}); var d=diff(j.end); if(d!==null && d<0) return "bad"; return (late||kb)?"warn":"ok"; }
function healthPill(j){ var h=projHealth(j); return pill(h==="ok"?"Saudável":h==="warn"?"Atenção":"Crítico",h); }
function stPill(j){ return pill(PST[j.status]?PST[j.status][0]:j.status,PST[j.status]?PST[j.status][1]:""); }
function taskItem(t,showProj){
  var dc=dateCls(t.due,t.status==="done");
  return '<div class="item"><span class="date '+dc+'">'+fmt(t.due)+'</span><div class="grow"><div class="t"><a href="#" data-act="task" data-id="'+t.id+'" style="color:inherit;text-decoration:none">'+esc(t.title)+'</a></div><div class="m">'+
    [pName(t.ownerId)||"Sem responsável", showProj&&t.projectId?jName(t.projectId):""].filter(Boolean).map(esc).join(" · ")+(t.status==="blocked"?' · <span style="color:var(--bad)">Bloqueada</span>':(t.status==="done"?' · Concluída':''))+'</div></div>'+
    '<span class="prio '+esc(t.priority)+'" title="Prioridade '+esc(PRIO[t.priority]||"")+'"></span></div>';
}
function followItem(f){
  var done=f.status==="feito", dc=dateCls(f.date,done);
  var who=[pName(f.personId),jName(f.projectId)].filter(Boolean).map(esc).join(" · ");
  return '<div class="item"><span class="date '+dc+'">'+fmt(f.date)+'</span><div class="grow"><div class="t"><a href="#" data-act="follow" data-id="'+f.id+'" style="color:inherit;text-decoration:none">'+esc(f.subject)+'</a> '+pill(f.kind,"mut")+'</div>'+
    (who?'<div class="m">'+who+'</div>':'')+(f.nextSteps?'<div class="m">Próximos passos: '+esc(f.nextSteps)+'</div>':'')+(done&&f.notes?'<div class="m">'+esc(f.notes)+'</div>':'')+'</div>'+
    (done?pill("Feito","ok"):'<button class="btn sm" data-act="follow-done" data-id="'+f.id+'">Concluir</button>')+'</div>';
}

function vPainel(){
  var t0=today();
  var activeP=S.projects.filter(function(j){return j.status!=="concluido";});
  var open=S.tasks.filter(function(t){return t.status!=="done";});
  var late=open.filter(isLate);
  var blocked=open.filter(function(t){return t.status==="blocked";});
  var fuPend=S.followups.filter(function(f){return f.status!=="feito";});
  var fuWeek=fuPend.filter(function(f){var d=diff(f.date);return d!==null&&d<=7;});
  var fuLate=fuPend.filter(function(f){return diff(f.date)<0;});
  var kpis=[]; S.projects.forEach(function(j){(j.kpis||[]).forEach(function(k){kpis.push(k);});});
  var onT=kpis.filter(function(k){return kpiCls(k)==="ok";}).length;
  var dg=diagSummary(), openPlans=S.diag.plans.filter(function(p){ return p.type==="acao"&&!planDone(p); }).length;
  var tiles='<div class="tiles">'+
    tile(activeP.length,"Projetos ativos","acc")+
    tile(open.length,"Tarefas abertas","")+
    tile(late.length,"Tarefas atrasadas",late.length?"bad":"ok")+
    tile(fuWeek.length,"Follow-ups até 7 dias",fuLate.length?"warn":"")+
    tile(kpis.length?Math.round(onT/kpis.length*100)+"%":"—","Indicadores no alvo ("+onT+" de "+kpis.length+")",kpis.length&&onT/kpis.length<0.6?"warn":"ok")+
    (S.diag.dims.length?tile(Math.round(dg.avg)+"%","Aderência de liderança · "+openPlans+" ações abertas",dg.avg<50?"bad":dg.avg<80?"warn":"ok"):"")+'</div>';
  var att=[];
  activeP.forEach(function(j){
    var R=j.est.items.length?calc(j):null;
    if(projHealth(j)==="bad") att.push('<div class="item"><span class="pill bad">Projeto</span><div class="grow"><div class="t"><a href="#projeto-'+j.id+'" style="color:inherit">'+esc(j.name)+'</a></div><div class="m">'+(j.status==="risco"?"Marcado em risco":"Prazo ou indicadores fora do esperado")+' · '+esc(pName(j.ownerId)||"sem responsável")+'</div></div></div>');
    else if(R && R.risk.overall==="Alto") att.push('<div class="item"><span class="pill warn">Estimativa</span><div class="grow"><div class="t"><a href="#projeto-'+j.id+'-estimativa" style="color:inherit">'+esc(j.name)+'</a></div><div class="m">Risco geral alto na estimativa W/Z/A · progresso '+Math.round(R.act)+'% vs '+Math.round(R.expd)+'% esperado</div></div></div>');
  });
  late.concat(blocked.filter(function(t){return !isLate(t);})).forEach(function(t){ att.push('<div class="item"><span class="pill '+(isLate(t)?"bad":"warn")+'">'+(isLate(t)?"Atrasada":"Bloqueada")+'</span><div class="grow"><div class="t"><a href="#" data-act="task" data-id="'+t.id+'" style="color:inherit">'+esc(t.title)+'</a></div><div class="m">'+esc(pName(t.ownerId)||"Sem responsável")+' · prazo '+fmt(t.due)+(t.notes?' · '+esc(t.notes):'')+'</div></div></div>'); });
  fuLate.forEach(function(f){ att.push('<div class="item"><span class="pill warn">Follow-up</span><div class="grow"><div class="t"><a href="#" data-act="follow" data-id="'+f.id+'" style="color:inherit">'+esc(f.subject)+'</a></div><div class="m">'+esc(pName(f.personId))+' · era para '+fmt(f.date)+' ('+rel(f.date)+')</div></div><button class="btn sm" data-act="follow-done" data-id="'+f.id+'">Concluir</button></div>'); });

  var projRows=sortBy(activeP,"end").map(function(j){ var h=projHealth(j), R=j.est.items.length?calc(j):null; return '<tr class="click" data-href="#projeto-'+j.id+'"><td><b>'+esc(j.name)+'</b><div class="small muted">'+esc(tName(j.teamId))+' · '+esc(pName(j.ownerId))+'</div></td><td>'+stPill(j)+'</td><td style="min-width:120px"><div class="row" style="flex-wrap:nowrap"><div style="flex:1">'+bar(num(j.progress),h==="bad"?"bad":"")+'</div><span class="small num">'+Math.round(num(j.progress))+'%</span></div></td><td class="num small">'+(R?Math.round(R.riskH)+'h · '+f1(R.sprints)+' sp':'<span class="muted">—</span>')+'</td><td class="num">'+fmt(j.end)+'</td><td>'+healthPill(j)+'</td></tr>'; }).join("");
  var maxL=1; S.people.forEach(function(p){ maxL=Math.max(maxL,openTasks(p.id).length); });
  var wl=S.people.map(function(p){ var o=openTasks(p.id), l=o.filter(isLate).length; return '<div class="wl"><span title="'+esc(p.name)+'" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.name.split(" ")[0])+(l?' <span style="color:var(--bad);font-size:12px">'+l+' atras.</span>':'')+'</span>'+bar(o.length/maxL*100,l?"bad":"")+'<span class="num small">'+o.length+'</span></div>'; }).join("");
  var nextF=sortBy(fuPend,"date").slice(0,6).map(followItem).join("");
  var dueSoon=sortBy(open.filter(function(t){var d=diff(t.due);return d!==null&&d>=0&&d<=7;}),"due").slice(0,6).map(function(t){return taskItem(t,true);}).join("");
  return {title:"Painel",sub:"Visão geral do time em "+fmt(t0)+"/"+t0.slice(0,4),
    actions:'<button class="btn" data-act="new-follow">+ Follow-up</button><button class="btn pri" data-act="new-task">+ Tarefa</button>',
    body:tiles+'<div class="grid2"><div class="stack">'+
      '<div class="panel"><h2>Precisa de atenção <span class="pill '+(att.length?"bad":"ok")+'">'+att.length+'</span></h2><div class="list">'+(att.join("")||'<div class="empty">Nada crítico agora.</div>')+'</div></div>'+
      '<div class="panel"><h2>Saúde dos projetos <a class="btn sm ghost" href="#projetos">Ver todos</a></h2><div class="tbl-wrap"><table><thead><tr><th>Projeto</th><th>Status</th><th>Progresso</th><th class="num">Estimativa</th><th class="num">Prazo</th><th>Saúde</th></tr></thead><tbody>'+(projRows||'<tr><td colspan="6" class="empty">Nenhum projeto ativo.</td></tr>')+'</tbody></table></div></div>'+
    '</div><div class="stack">'+
      '<div class="panel"><h2>Próximos follow-ups <a class="btn sm ghost" href="#followups">Ver todos</a></h2><div class="list">'+(nextF||'<div class="empty">Nenhum follow-up pendente.</div>')+'</div></div>'+
      '<div class="panel"><h2>Vencem nos próximos 7 dias</h2><div class="list">'+(dueSoon||'<div class="empty">Nenhuma tarefa vencendo.</div>')+'</div></div>'+
      '<div class="panel"><h2>Carga por pessoa <span class="small muted" style="font-family:var(--body);font-weight:500">tarefas abertas</span></h2>'+(wl||'<div class="empty">Cadastre pessoas do time.</div>')+'</div>'+
    '</div></div>'};
}

    case "pz-clear": if(p) confirmBox("Remover todas as peças? O fundo é mantido.",function(){ p.puzzle.regions=[]; PZ.sel=null; PZ.focus=null; },"Remover peças"); break;
    case "pz-gen": if(p){ if(p.puzzle.regions.length) confirmBox("Substituir as peças atuais por uma peça para cada tarefa do projeto?",function(){ pzGenerate(p); },"Gerar peças"); else { pzGenerate(p); commit(); } } break;
    case "pz-mktask": if(p){ var r3=p.puzzle.regions.filter(function(x){ return x.uid===a.getAttribute("data-rid"); })[0]; if(r3){ var tk={id:uid(),title:r3.title,projectId:p.id,ownerId:(S.people.filter(function(x){ return x.name===r3.owner; })[0]||{}).id||"",status:({planned:"todo",progress:"doing",blocked:"blocked",done:"done"})[r3.status]||"todo",priority:"media",due:"",notes:r3.notes||""}; S.tasks.push(tk); r3.taskId=tk.id; commit(); toast("Tarefa criada e vinculada à peça."); } } break;
    // liderança
    case "lid-sub": LSUB=a.getAttribute("data-sub"); if(route()!=="lideranca") location.hash="lideranca"; else render(); break;
    case "dim-add": editGeneric(S.diag.dims,null,"dimensão",F.dim,null,true); break;
    case "dim-edit": editGeneric(S.diag.dims,byId(S.diag.dims,id),"dimensão",F.dim,function(d){ S.diag.plans.forEach(function(x){ if(x.dimId===d.id) x.dimId=""; }); },true); break;
    case "swot-add": openForm({title:"Novo item SWOT",fields:F.swot,values:{quad:a.getAttribute("data-q")||"Força"},onSave:function(v){ S.diag.swot.push(Object.assign({id:uid()},v)); }}); break;
    case "swot-edit": editGeneric(S.diag.swot,byId(S.diag.swot,id),"item SWOT",F.swot); break;
    case "plan-add": openForm({title:"Novo plano ou risco",fields:F.plan,values:{dimId:a.getAttribute("data-dim")||""},wide:true,onSave:function(v){ S.diag.plans.push(Object.assign({id:uid(),taskId:""},v)); }}); break;
    case "plan-edit": editGeneric(S.diag.plans,byId(S.diag.plans,id),"plano ou risco",F.plan,null,true); break;
    case "plan-task": var pl=byId(S.diag.plans,id); if(pl){ var tt={id:uid(),title:pl.desc,projectId:"",ownerId:"",status:pl.status==="Em andamento"?"doing":"todo",priority:pl.priority==="Alta"?"alta":pl.priority==="Baixa"?"baixa":"media",due:"",notes:"Plano de liderança · "+(byId(S.diag.dims,pl.dimId)||{name:""}).name}; S.tasks.push(tt); pl.taskId=tt.id; commit(); toast("Tarefa criada. Concluir a tarefa conclui o plano."); } break;
    case "sk-add": openForm({title:"Nova skill do time",fields:F.skill,onSave:function(v){ S.skills.team.push(Object.assign({id:"s"+uid()},v)); }}); break;
    case "sk-edit": var sk0=byId(S.skills.team,id); if(sk0) openForm({title:"Editar skill",fields:F.skill,values:sk0,onSave:function(v){ Object.assign(sk0,v); },onDelete:function(){ S.skills.team=S.skills.team.filter(function(x){ return x!==sk0; }); Object.keys(S.skills.teamLv).forEach(function(k){ delete S.skills.teamLv[k][sk0.id]; }); }}); break;
    case "sk-cell": var pp2=byId(S.people,a.getAttribute("data-pid2")), sk1=byId(S.skills.team,id); if(pp2&&sk1){ var cur0=skCell(pp2.id,sk1.id); openForm({title:sk1.name+" · "+pp2.name,fields:F.skcell,values:cur0?{cur:String(cur0.cur),tgt:String(cur0.tgt)}:{cur:"1",tgt:"2"},onSave:function(v){ (S.skills.teamLv[pp2.id]=S.skills.teamLv[pp2.id]||{})[sk1.id]={cur:num(v.cur),tgt:num(v.tgt)}; },onDelete:cur0?function(){ delete S.skills.teamLv[pp2.id][sk1.id]; }:null}); } break;
    case "sk-pdi": var pp3=byId(S.people,a.getAttribute("data-pid2")), sk2=byId(S.skills.team,id), mm=byId(S.people,a.getAttribute("data-m")); if(pp3&&sk2){ var c1=skCell(pp3.id,sk2.id); S.tasks.push({id:uid(),title:"PDI: evoluir "+sk2.name+" de "+num(c1.cur)+" para "+num(c1.tgt),projectId:"",ownerId:pp3.id,status:"todo",priority:"media",due:"",notes:mm?"Mentoria com "+mm.name:""}); if(!pp3.devAction) pp3.devAction="Evoluir "+sk2.name+(mm?" com mentoria de "+mm.name:""); commit(); toast("Ação de PDI criada como tarefa de "+pp3.name.split(" ")[0]+"."); } break;
    case "cs-add": openForm({title:"Nova competência da coordenação",fields:F.coordsk,values:{cur:"2",tgt:"4"},onSave:function(v){ v.cur=num(v.cur); v.tgt=num(v.tgt); S.skills.coord.push(Object.assign({id:"cs"+uid()},v)); }}); break;
    case "cs-edit": var cs0=byId(S.skills.coord,id); if(cs0) openForm({title:"Editar competência",fields:F.coordsk,values:Object.assign({},cs0,{cur:String(cs0.cur),tgt:String(cs0.tgt)}),onSave:function(v){ v.cur=num(v.cur); v.tgt=num(v.tgt); Object.assign(cs0,v); },onDelete:function(){ S.skills.coord=S.skills.coord.filter(function(x){ return x!==cs0; }); }}); break;
    // modelos
    case "cat-add": S.catalog.push({id:"c"+uid(),code:"SUB-"+String(S.catalog.length).padStart(2,"0"),theme:"",name:"Nova atividade",time:1,unit:"dia",ai:0,obs:""}); commit(); break;
    case "cat-del": var cat=byId(S.catalog,id); if(cat){ var used=S.projects.some(function(pp){ return pp.est.items.some(function(x){ return x.acts[cat.id]; }); }); confirmBox("Excluir a atividade “"+cat.name+"”?"+(used?" Ela será removida dos itens que a usam.":""),function(){ S.catalog=S.catalog.filter(function(x){ return x!==cat; }); S.projects.forEach(function(pp){ pp.est.items.forEach(function(x){ delete x.acts[cat.id]; }); }); },"Excluir"); } break;
    case "crit-grade": MGRADE=a.getAttribute("data-g"); render(); break;
    case "crit-add": var lst=S.criteria[MGRADE]; lst.push({id:MGRADE.toLowerCase()+uid(),group:lst.length?lst[lst.length-1].group:"Pilar 1",label:"Novo critério",weight:5,dir:"direct"}); commit(); break;
    case "crit-del": S.criteria[MGRADE]=S.criteria[MGRADE].filter(function(c){ return c.id!==id; }); commit(); break;
    case "crit-clear": confirmBox("Remover todos os critérios do "+GRADES[MGRADE].t+"? As avaliações da matriz deste grau deixam de valer.",function(){ S.criteria[MGRADE]=[]; },"Remover"); break;
  }
}
function showText(txt){ formCtx={}; modal.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h2>Resumo executivo</h2><div class="fld"><textarea id="sum-text" readonly style="min-height:260px;font-size:13px">'+esc(txt)+'</textarea></div><p class="tiny muted">Selecione o texto e copie (Ctrl+C).</p><div class="foot"><span></span><button class="btn" data-act="close">Fechar</button></div></div>'; modal.hidden=false; var t=document.getElementById("sum-text"); if(t){ t.focus(); t.select(); } }
function openBackup(){
  formCtx={};
  modal.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="bkt"><h2 id="bkt">Backup e dados</h2><p class="small muted">'+(art?'Tudo o que você edita fica salvo no próprio portal.':'O salvamento automático está desligado, então as edições se perdem ao recarregar a página.')+' Para guardar uma cópia, copie o conteúdo abaixo e cole num arquivo de texto (.json). Para restaurar, cole de volta ou escolha o arquivo.</p>'+
    '<div class="fld"><label for="bk-json">Dados atuais</label><textarea id="bk-json" readonly style="min-height:110px;font-family:monospace;font-size:12px">'+esc(JSON.stringify(S))+'</textarea></div><div class="row" style="margin:8px 0 18px"><button class="btn sm" data-act="copy-json">Copiar dados</button></div>'+
    '<div class="fld"><label for="bk-in">Restaurar de um backup</label><textarea id="bk-in" placeholder="Cole aqui o conteúdo copiado anteriormente" style="font-family:monospace;font-size:12px"></textarea></div><label class="btn sm" style="margin-top:6px;cursor:pointer">Escolher arquivo .json<input type="file" accept=".json,.txt,application/json" data-import-file="1" style="display:none"></label><div class="err" id="bk-err"></div>'+
    '<div class="foot"><button class="btn danger" data-act="clear-all">Apagar tudo</button><div class="row"><button class="btn" data-act="close">Fechar</button><button class="btn pri" data-act="import-json">Restaurar</button></div></div></div>';
  modal.hidden=false;
}
render();
})();
</script>
